[ci]
runtime = "nix"
runner = "ubuntu-24.04"
with_docs = true
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
publish_crates = true
all_features = false

[ci.pages]
repo = "caniko/nix-pklx"
canonical_domain = "nix-pklx.tartanoglu.com"
token_secret = "CODEBERG_TOKEN"
