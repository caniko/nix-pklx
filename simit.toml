[ci]
runtime = "nix"
runner = "ubuntu-24.04"
with_docs = true
with_msrv = true
with_audit = true
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"
publish_crates = true
all_features = false
publish_strategy = "members"

[ci.pages]
repo = "caniko/nix-pklx"
canonical_domain = "nix-pklx.tartanoglu.com"
token_secret = "CODEBERG_TOKEN"

[release.github]
repo = "caniko/nix-pklx"
target_branch = "trunk"

# Prebuilt cargo-binstall archives: the flake's
# `packages.<system>.release-bundle` is built once per system and uploaded to
# the release, so `cargo binstall pklx` never compiles.
[release.artifacts]
prebuild_binaries = true
binstall = true
system_runners = { x86_64-linux = "ubuntu-24.04", aarch64-darwin = "macos-15" }
sign = false
