[ci]
runtime = "nix"
runner = "codeberg-medium"
with_docs = true
step_runners = { cargo-clippy = "codeberg-small", cargo-doc = "codeberg-small", cargo-fmt = "codeberg-tiny", cargo-package = "codeberg-medium", cargo-test = "codeberg-medium", nix-check = "atlas-nix-trusted", quality-tools = "codeberg-small" }
provider = "actions"
platform = "forgejo"
publish_crates = true

[ci.pages]
repo = "caniko/nix-pklx"
canonical_domain = "nix-pklx.tartanoglu.com"
token_secret = "CODEBERG_TOKEN"
