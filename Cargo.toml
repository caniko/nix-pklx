[package]
name = "pklx"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Pkl ↔ Nix interop: evaluate Pkl files to native Nix expressions + Nix library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/nix-pklx"
homepage = "https://github.com/caniko/nix-pklx"
documentation = "https://docs.rs/pklx"
keywords = ["pkl", "nix", "nixos", "configuration"]
categories = ["encoding", "config"]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE-*"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["cli"]
# The CLI is this crate's product and is always built; the flag is kept so
# existing `--features cli` / `--no-default-features` consumers keep working.
cli = []

[[bin]]
name = "pklx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# pklx evaluates local files, remote imports, and package:// ZIP archives, and
# surfaces pklr diagnostics through miette. Keep pklr's capability features
# explicit so a default-feature change upstream cannot silently remove one.
pklr = { version = "5.2.0", default-features = false, features = [
  "eval-core",
  "native-io",
  "http",
  "package-zip",
  "miette-diagnostics",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
miette = "7"
thiserror = "2"
serde = "1"
serde_json = "1"
indexmap = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/pklx-{ version }-aarch64-apple-darwin.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/pklx-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/pklx-{ version }-aarch64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/pklx-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/pklx-{ version }-x86_64-unknown-linux-musl.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
